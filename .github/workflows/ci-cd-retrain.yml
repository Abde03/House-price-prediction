name: CI-CD and Retraining

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      force_data_refresh:
        description: 'Download latest dataset from DATASET_URL secret before retraining'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read
  packages: write

concurrency:
  group: house-pricing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python sources
        run: |
          python -m compileall src

      - name: Verify pipeline CLI
        run: |
          python src/pipeline.py --help

  retrain:
    name: Retrain and Package Model
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh raw dataset (optional)
        env:
          DATASET_URL: ${{ secrets.DATASET_URL }}
          FORCE_DATA_REFRESH: ${{ github.event_name == 'schedule' || github.event.inputs.force_data_refresh == 'true' }}
        run: |
          mkdir -p data/raw
          if [ "$FORCE_DATA_REFRESH" = "true" ] && [ -n "$DATASET_URL" ]; then
            echo "Downloading latest dataset from DATASET_URL"
            curl -fL "$DATASET_URL" -o data/raw/houses_data_eng.csv
            echo "Dataset refreshed: data/raw/houses_data_eng.csv"
          else
            echo "Skipping dataset refresh. Using repository data or existing processed data fallback."
          fi

      - name: Run preprocessing and training pipeline
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: |
          python src/pipeline.py

      - name: Upload trained artifacts
        uses: actions/upload-artifact@v4
        with:
          name: house-pricing-model-artifacts
          path: |
            data/processed/cleaned_data.csv
            models/best_model.pkl
            models/feature_schema.json
            models/model_metadata.json
            results/model_comparison.csv
            results/*.png
          if-no-files-found: error

  deploy:
    name: Build and Publish Deployment Image
    runs-on: ubuntu-latest
    needs: retrain
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download training artifacts
        uses: actions/download-artifact@v4
        with:
          name: house-pricing-model-artifacts
          path: .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker image name
        run: |
          LOWER_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${LOWER_OWNER}/house-pricing-app" >> $GITHUB_ENV

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
